<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E31C25;
            --primary-dark: #c0161e;
            --dark: #1C1C1C;
            --dark-light: #2d2d2d;
            --light: #ffffff;
            --gray: #f5f5f5;
            --text: #333333;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--light);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: var(--primary);
            padding: 40px 20px 30px;
            text-align: center;
            position: relative;
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 5px solid var(--light);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: var(--light);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: var(--transition);
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            color: var(--light);
            margin-bottom: 5px;
        }

        .username {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
        }

        .card-body {
            padding: 35px 30px;
        }

        .bio {
            font-size: 16px;
            color: var(--text);
            text-align: center;
            margin-bottom: 35px;
            line-height: 1.7;
            background: var(--gray);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gray);
            color: var(--dark);
            transition: var(--transition);
            text-decoration: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .social-link:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .social-link.github:hover {
            background: var(--dark);
            color: white;
        }

        .social-link.telegram:hover {
            background: #0088cc;
            color: white;
        }

        .social-icon {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .email-container {
            text-align: center;
        }

        .email {
            display: inline-block;
            padding: 14px 30px;
            background: var(--primary);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(227, 28, 37, 0.3);
            font-size: 15px;
        }

        .email:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(227, 28, 37, 0.4);
        }

        /* Badge de habilidades */
        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .skill-tag {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .card-body {
                padding: 30px 20px;
            }
            
            .avatar-container {
                width: 120px;
                height: 120px;
            }
            
            .name {
                font-size: 24px;
            }
            
            .social-links {
                gap: 20px;
            }
            
            .social-link {
                width: 55px;
                height: 55px;
            }
        }

        @media (max-width: 350px) {
            .card-body {
                padding: 25px 15px;
            }
            
            .avatar-container {
                width: 100px;
                height: 100px;
            }
            
            .name {
                font-size: 22px;
            }
            
            .social-links {
                gap: 15px;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-card {
            animation: fadeIn 0.8s ease-out;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card" id="profileCard">
            <div class="card-header">
                <div class="avatar-container">
                    <img id="avatar" class="avatar" src="https://avatars.githubusercontent.com/u/9919?v=4" alt="Avatar">
                </div>
                <h1 id="name" class="name">Cargando...</h1>
                <p id="username" class="username">@username</p>
            </div>
            <div class="card-body">
                <div class="skills">
                    <span class="skill-tag">Desarrollo Web</span>
                    <span class="skill-tag">Python</span>
                    <span class="skill-tag">Bots de Telegram</span>
                </div>
                
                <p id="bio" class="bio">🚀 Desarrollador en formación apasionado por crear experiencias web y bots de Telegram con Python. Aprendiendo cada día y construyendo proyectos que resuelven problemas reales.</p>
                
                <div class="social-links">
                    <a href="#" id="github" class="social-link github" target="_blank">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                    </a>
                    <a href="#" id="telegram" class="social-link telegram" target="_blank">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.509l-3-2.21-1.447 1.394c-.14.14-.26.26-.534.26l.213-3.053 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.136-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
                        </svg>
                    </a>
                </div>
                
                <div class="email-container">
                    <a href="#" id="email" class="email">alvarodavidc29@gmail.com</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de configuración
        const Github_Username = "Shorisound";
        const Email_Id = "alvarodavidc29@gmail.com";
        const Telegram_Username = "Shorisound"; // Cambia por tu usuario real

        // Biografía personalizada
        const Custom_Bio = "🚀 Desarrollador en formación apasionado por crear experiencias web y bots de Telegram con Python. Aprendiendo cada día y construyendo proyectos que resuelven problemas reales.";

        // Elementos del DOM
        const profileCard = document.getElementById('profileCard');
        const avatar = document.getElementById('avatar');
        const name = document.getElementById('name');
        const username = document.getElementById('username');
        const bio = document.getElementById('bio');
        const githubLink = document.getElementById('github');
        const telegramLink = document.getElementById('telegram');
        const emailLink = document.getElementById('email');

        // Mostrar estado de carga
        profileCard.classList.add('loading');

        // Función para obtener datos de GitHub
        async function fetchGitHubData() {
            try {
                const response = await fetch(`https://api.github.com/users/${Github_Username}`);
                if (!response.ok) {
                    throw new Error('Error al cargar los datos de GitHub');
                }
                const data = await response.json();
                
                // Actualizar la interfaz con los datos
                avatar.src = data.avatar_url;
                name.textContent = data.name || data.login;
                username.textContent = `@${data.login}`;
                
                // Usar biografía personalizada si no hay una en GitHub
                bio.textContent = data.bio && data.bio.trim() !== '' ? data.bio : Custom_Bio;
                
                // Actualizar enlaces
                githubLink.href = data.html_url;
                telegramLink.href = `https://t.me/${Telegram_Username}`;
                emailLink.href = `mailto:${Email_Id}`;
                
                // Quitar estado de carga
                profileCard.classList.remove('loading');
                
            } catch (error) {
                console.error('Error:', error);
                // Mostrar datos por defecto en caso de error
                name.textContent = Github_Username;
                username.textContent = `@${Github_Username}`;
                bio.textContent = Custom_Bio;
                githubLink.href = `https://github.com/${Github_Username}`;
                telegramLink.href = `https://t.me/${Telegram_Username}`;
                emailLink.href = `mailto:${Email_Id}`;
                profileCard.classList.remove('loading');
            }
        }

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', fetchGitHubData);
    </script>
</body>
</html>
